# Cloudflare Pages configuration.
#
# The site itself needs none of this — `public/` is a static directory and deploys fine
# with no config at all. This exists only to bind the optional D1 cache, and everything
# still works if the binding is missing (the functions return empty leads, and the client
# falls back to the files bundled in public/data/).
#
# Setup:
#   npx wrangler d1 create aitb-leads          # prints the database_id below
#   npx wrangler d1 execute aitb-leads --remote --file=schema.sql
#   python3 scripts/seed_cache.py > seed.sql
#   npx wrangler d1 execute aitb-leads --remote --file=seed.sql

name = "aitb-hackathon"
pages_build_output_dir = "public"
compatibility_date = "2026-08-02"

[[d1_databases]]
binding = "DB"                 # env.DB inside functions/
database_name = "aitb-leads"
database_id = "REPLACE_WITH_ID_FROM_WRANGLER_D1_CREATE"
