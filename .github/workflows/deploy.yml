name: test

# Deployment is NOT done here — see the note at the bottom of this file and docs/DEPLOY.md.
# This workflow's job is to stop a broken commit from reaching main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only. The `pages: write` / `id-token: write` grants were here for the GitHub Pages
# deploy that this workflow no longer performs; a token that can publish is not something to
# leave lying around for a job that only runs tests.
permissions:
  contents: read

# Keyed per ref, not the single global `pages` group the deploy job needed. With one shared
# group, two PRs pushed at once cancelled each other's test runs and the loser looked green
# because it never ran.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to current majors. The older v4/v5 actions run on the Actions runner's Node 20,
      # which GitHub is deprecating — that was the warning at the top of the failing run.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }

      # No dependencies to install — core/ is stdlib-only and the browser build has no
      # bundler. That is deliberate; `test_api_has_no_third_party_dependencies` enforces it.
      - name: Rules are generated, not hand-copied
        run: |
          python3 scripts/export_rules.py
          git diff --exit-code public/js/rules.js \
            || (echo "::error::public/js/rules.js is stale — run scripts/export_rules.py" && exit 1)

      - name: Test suite (includes Python↔JS conformance)
        run: python3 -m unittest discover -s tests -t . -q

      # The Node suite covers the API seams the Python suite cannot reach: the request
      # handler, the input validator, the store, and the spend guards.
      #
      # How this command is written has broken twice, both times silently:
      #   - a quoted glob ("tests/js/**/*.test.js") is expanded by `node --test` itself,
      #     which only supports it from Node 21 — on the old Node 20 pin it matched nothing
      #     and nine real failures accumulated behind a green build;
      #   - a bare directory (tests/js/) works on Node 20 but Node 22 resolves it as a
      #     module and dies with MODULE_NOT_FOUND.
      # It now passes explicit file paths, expanded by the shell before Node sees them —
      # the most stable form the runner accepts, independent of the version pinned above.
      # tests/test_js_suite_runs.py asserts the suite genuinely executes, so a third variant
      # of this mistake fails the build instead of hiding.
      - name: API seam tests (handler, validation, store, guards)
        run: npm run test:js

      # Supply chain. The Agent SDK runs with ANTHROPIC_API_KEY in its environment, so a
      # compromised dependency reads the key — that is the highest-impact, lowest-effort
      # attack on this repo, and nothing was checking for it.
      #
      # Threshold is `moderate` rather than `high` on purpose: the runtime surface is two
      # direct dependencies (~110 packages total), so the noise is low, and the advisory
      # this gate was written for (hono ReDoS, GHSA-8j4g-w8fx-2239) was itself moderate.
      # Raise it to `high` if it ever starts blocking unrelated deploys.
      - name: Dependencies have no known advisories
        run: npm audit --audit-level=moderate

      # An out-of-date lockfile means CI and production install different code than anyone
      # reviewed. `npm ci` fails outright when package.json and the lockfile disagree, so
      # this doubles as the "is the lockfile committed and current" check.
      - name: Lockfile is committed and matches package.json
        run: npm ci --ignore-scripts

# ---------------------------------------------------------------------------------------
# There is deliberately no deploy job here any more.
#
# This workflow used to publish `public/` to GitHub Pages. That dated from when the product
# genuinely was a static site. It is not one now: the planner POSTs to /api/plan, the viewer
# GETs /api/plan/:id, and the gallery GETs /api/plans — Vercel serverless functions backed by
# a Neon Postgres database. GitHub Pages serves static files only, so a Pages deploy shipped
# a site whose three main features returned 404, and the /plan/:id permalink rewrite (defined
# in vercel.json) did not exist at all.
#
# The immediate failure was `actions/configure-pages` reporting "Get Pages site failed" —
# Pages had never been enabled on the repo. Enabling it would have replaced a loud failure
# with a quiet one: a deploy that succeeds and serves a broken app.
#
# Deployment is Vercel's Git integration, which builds from vercel.json on push to main and
# needs nothing from Actions. See docs/DEPLOY.md.
# ---------------------------------------------------------------------------------------
