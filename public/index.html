<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Hack-AI-Thon in a Box</title>
<meta name=description content="Type five things about your event and watch an AI research your city — real, sourced venues, sponsors, and mentors — then build your plan.">
<style>
:root{--bg:#fff;--fg:#14181f;--muted:#5b6472;--line:#e6e9ef;--card:#f7f8fa;
--accent:#4f46e5;--accent-soft:#eef0ff;--hi:#0f8a4f;--hi-bg:#e6f6ec;
--warn:#b23b3b;--warn-bg:#fbebeb;--lock:#8a8f98;--lock-bg:#f0f1f4}
@media(prefers-color-scheme:dark){:root{--bg:#0f1319;--fg:#e8ebf0;--muted:#9aa4b2;
--line:#232a35;--card:#171c24;--accent:#8b85f5;--accent-soft:#1e2130;--hi:#4ade80;
--hi-bg:#10281b;--warn:#f87171;--warn-bg:#2a1414;--lock:#6b7280;--lock-bg:#161a21}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 80px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px}
.panel{border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--card)}
.panel h2{margin:0 0 3px;font-size:1.15rem}
.panel .q{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.field{margin-bottom:15px}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:5px}
.hint{font-weight:400;color:var(--muted);font-size:.82rem}
input[type=text],input[type=date],input[type=number],select,textarea{
width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;
background:var(--bg);color:var(--fg);font:inherit;font-size:.95rem}
textarea{min-height:74px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{
outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:8px;margin-bottom:8px}
.seg button{flex:1;padding:10px;border:1px solid var(--line);border-radius:9px;
background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);
color:var(--accent);font-weight:700}
.check{display:flex;align-items:center;gap:8px;font-weight:400;font-size:.9rem;
color:var(--fg);margin-top:8px;cursor:pointer}
.check input{width:auto}
button.primary{width:100%;margin-top:6px;padding:13px;border:0;border-radius:10px;
background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
button.primary:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--warn);font-size:.9rem;margin-top:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.run{margin-top:26px}
.run .status{display:inline-flex;align-items:center;gap:9px;padding:11px 15px;
border:1px solid var(--line);border-radius:10px;background:var(--card);
font-size:.92rem;font-weight:600}
.run .status .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);
animation:pulse 1.2s ease-in-out infinite}
.run .note{color:var(--muted);font-size:.85rem;margin-top:10px}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.watch{display:inline-flex;align-items:center;gap:8px;margin:2px 0 22px;padding:9px 15px;
border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--fg);
font:inherit;font-size:.88rem;font-weight:600;cursor:pointer}
.watch:hover{border-color:var(--accent);color:var(--accent)}
.watch .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;
background:#000;margin:2px 0 22px;border:1px solid var(--line)}
.video img{width:100%;height:100%;object-fit:cover;display:block;opacity:.75}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
background:transparent;border:0;cursor:pointer;width:100%;height:100%;padding:0}
.video .play .ring{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.55);
display:flex;align-items:center;justify-content:center;transition:transform .15s}
.video .play:hover .ring{transform:scale(1.08);background:rgba(0,0,0,.7)}
.video .play svg{width:22px;height:22px;fill:#fff;margin-left:3px}
</style>
</head>
<body>
<div class=wrap>
  <h1>Hack-AI-Thon in a Box</h1>
  <p class=sub>Type five things about your event. An AI researches your city — real, sourced
  venues, sponsors, and mentors — and builds your plan.</p>

  <div id=videoSlot></div>

  <div class=panel>
    <h2>Tell us about your hackathon</h2>
    <p class=q>Five questions plus your organization. Submit once, then watch it work.</p>
    <form id=intake novalidate>
      <div class=field>
        <label for=org_name>Your organization</label>
        <input type=text id=org_name autocomplete=organization
          placeholder="e.g. Boise Public Library">
      </div>

      <div class=field>
        <label for=city>City <span class=hint>— City, ST</span></label>
        <input type=text id=city required placeholder="e.g. Boise, ID">
      </div>

      <div class=field>
        <label>When?</label>
        <div class=seg id=timingSeg>
          <button type=button data-mode=date aria-pressed=false>I have a date</button>
          <button type=button data-mode=window aria-pressed=true>Not sure yet</button>
        </div>
        <input type=date id=event_date style="display:none">
        <input type=text id=date_window placeholder="Rough window, e.g. late October 2026">
      </div>

      <div class=field>
        <label for=budget_usd>Budget (USD)</label>
        <input type=number id=budget_usd min=0 step=100 placeholder="e.g. 500">
        <label class=check for=budget_free>
          <input type=checkbox id=budget_free> Free / $0 budget
        </label>
      </div>

      <div class=field>
        <label for=audience>Who is it for?</label>
        <select id=audience>
          <option value=anyone>Anyone — open to all</option>
          <option value=non-technical selected>Non-technical folks</option>
          <option value=technical>Technical / builders</option>
          <option value=mixed>A mix</option>
        </select>
      </div>

      <div class=field>
        <label for=purpose>Why should someone give up a Saturday for this?</label>
        <textarea id=purpose
          placeholder="e.g. Help local nonprofits build practical AI tools they actually need."></textarea>
      </div>

      <div class=field>
        <label for=anchor>Do you already know a local venue or partner to anchor it?</label>
        <select id=anchor>
          <option value=no selected>No — help me find one</option>
          <option value=yes>Yes — I have a local anchor</option>
        </select>
      </div>

      <button class=primary id=go type=submit>Generate my plan</button>
      <div class=err id=err role=alert></div>
    </form>
  </div>

  <div id=run class=run></div>
  <p id=live aria-live=polite class=sr></p>
</div>

<script>
/* The live product is the agentic pipeline (ADR-0001): this form collects the five inputs
   plus org name and the local-anchor question, POSTs them ONCE to /api/plan, and the server
   streams the run back. The old deterministic-core UX (six chunks, gates, client-side
   render) is set aside — public/js/*.js stay in the repo as legacy but are no longer on the
   live path. Ticket #4 keeps the front-end minimal: submit, validate, and a "run started"
   placeholder. The live activity log (ticket #5) and the plan render (ticket #6) build on
   the stream reader below. */

/* Set this after uploading the demo video to YouTube as UNLISTED (see docs/DEPLOY.md).
   The ID is the part after "v=" in the video's URL, e.g. "dQw4w9WgXcQ". Leave it empty
   and the section renders nothing rather than a broken player — an unset placeholder
   should never ship as if it were a real link. */
const DEMO_VIDEO_ID = '';

const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; };
const $ = (id) => document.getElementById(id);

/* Click-to-embed, not autoload: the iframe (and YouTube's own JS) only loads once someone
   asks for it, so the landing page stays fast and nobody's visit pings YouTube by default.
   youtube-nocookie.com is the privacy-enhanced embed domain — no tracking cookie until
   playback actually starts. */
function renderVideo() {
  const slot = $('videoSlot');
  if (!DEMO_VIDEO_ID) { slot.innerHTML = ''; return; }

  const btn = el('button', 'watch');
  btn.type = 'button';
  btn.innerHTML = '<span class=dot></span> Watch the demo';
  btn.onclick = () => {
    const box = el('div', 'video');
    const img = document.createElement('img');
    img.src = `https://i.ytimg.com/vi/${DEMO_VIDEO_ID}/hqdefault.jpg`;
    img.alt = ''; img.loading = 'lazy';
    const play = el('button', 'play'); play.type = 'button';
    play.setAttribute('aria-label', 'Play the demo video');
    play.innerHTML = '<span class=ring><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>';
    play.onclick = () => {
      const f = document.createElement('iframe');
      f.src = `https://www.youtube-nocookie.com/embed/${DEMO_VIDEO_ID}?autoplay=1&rel=0`;
      f.title = 'Hack-AI-Thon in a Box — demo';
      f.allow = 'accelerometer; autoplay; encrypted-media; picture-in-picture';
      f.allowFullscreen = true;
      box.innerHTML = ''; box.appendChild(f);
    };
    box.appendChild(img); box.appendChild(play);
    slot.innerHTML = ''; slot.appendChild(box);
  };
  slot.innerHTML = ''; slot.appendChild(btn);
}

/* Date vs. rough window: the timeline counts back from a hard date, or works to a window
   when the organizer has not committed. Only the chosen one is sent. */
let timingMode = 'window';
function setTiming(mode) {
  timingMode = mode;
  [...$('timingSeg').children].forEach((b) =>
    b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
  $('event_date').style.display = mode === 'date' ? '' : 'none';
  $('date_window').style.display = mode === 'window' ? '' : 'none';
}
$('timingSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-mode]');
  if (b) setTiming(b.dataset.mode);
});

/* A $0 budget is a real answer, not a blank — the toggle sends budget_usd: 0 and takes the
   number field out of play. */
$('budget_free').addEventListener('change', () => {
  $('budget_usd').disabled = $('budget_free').checked;
});

/* Collect the raw payload. Only include a field the organizer actually filled — cleanInputs
   on the server treats an absent field and an empty one the same, and validates the rest. */
function collectInputs() {
  const inputs = {};
  const org = $('org_name').value.trim(); if (org) inputs.org_name = org;
  const city = $('city').value.trim(); if (city) inputs.city = city;

  if (timingMode === 'date') {
    if ($('event_date').value) inputs.event_date = $('event_date').value;
  } else {
    const w = $('date_window').value.trim(); if (w) inputs.date_window = w;
  }

  if ($('budget_free').checked) {
    inputs.budget_usd = 0;
  } else {
    const b = $('budget_usd').value.trim();
    if (b !== '') inputs.budget_usd = Number(b);
  }

  inputs.audience = $('audience').value;
  const purpose = $('purpose').value.trim(); if (purpose) inputs.purpose = purpose;
  inputs.has_local_anchor = $('anchor').value === 'yes';
  return inputs;
}

/* Parse the Server-Sent-Events stream frame by frame, handing each decoded event to
   `onEvent`. This is the seam ticket #5 builds the live activity log on. Event shapes:
     { type:'stage',    stage, detail? }
     { type:'complete', plan_json, plan_html }
     { type:'error',    message } */
async function readStream(res, onEvent) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) !== -1) {
      const frame = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      const line = frame.split('\n').find((l) => l.startsWith('data: '));
      if (!line) continue;
      try { onEvent(JSON.parse(line.slice(6))); } catch (_) { /* ignore a partial frame */ }
    }
  }
}

function setStatus(text) {
  const box = $('run');
  box.innerHTML = '';
  const s = el('div', 'status');
  s.appendChild(el('span', 'dot'));
  s.appendChild(document.createTextNode(text));
  box.appendChild(s);
  box.appendChild(el('div', 'note',
    'Watching the run live. The full activity log and your finished plan land in a later update.'));
  $('live').textContent = text;
}

async function generate(ev) {
  ev.preventDefault(); // CSP sets form-action 'none'; we submit via fetch, never a navigation
  const err = $('err');
  err.textContent = '';
  const inputs = collectInputs();

  if (!inputs.city) { err.textContent = 'Please enter your city (City, ST).'; return; }

  const go = $('go');
  go.disabled = true;
  go.textContent = 'Working…';
  $('run').innerHTML = '';

  let res;
  try {
    res = await fetch('./api/plan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(inputs),
    });
  } catch (_) {
    err.textContent = 'Could not reach the planner. Check your connection and try again.';
    resetButton();
    return;
  }

  if (!res.ok) {
    let msg = 'That input was rejected — please check your answers and try again.';
    if (res.status === 503) {
      msg = 'The planner is offline right now. Please try again later.';
    } else {
      try { const j = await res.json(); if (j && j.message) msg = j.message; } catch (_) {}
    }
    err.textContent = msg;
    resetButton();
    return;
  }

  setStatus('Run started — normalizing your inputs…');
  try {
    await readStream(res, (event) => {
      if (event.type === 'stage') {
        setStatus('Working: ' + String(event.stage).replace(/_/g, ' '));
      } else if (event.type === 'complete') {
        setStatus('Your plan is ready. (Rendering it in the page arrives in a later update.)');
      } else if (event.type === 'error') {
        $('err').textContent = 'The run failed: ' + event.message;
        $('run').innerHTML = '';
      }
    });
  } catch (_) {
    err.textContent = 'The run was interrupted. Please try again.';
  }
  resetButton();
}

function resetButton() {
  const go = $('go');
  go.disabled = false;
  go.textContent = 'Generate my plan';
}

$('intake').addEventListener('submit', generate);

renderVideo();
setTiming('window');
</script>
</body>
</html>
