<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Hackathon plan — Hack-AI-Thon in a Box</title>
<meta name=description content="A saved, sourced hackathon plan — venues, sponsors, mentors, and a dated timeline for your city.">
<style>
:root{--bg:#fff;--fg:#14181f;--muted:#5b6472;--line:#e6e9ef;--card:#f7f8fa;
--accent:#4f46e5;--accent-soft:#eef0ff;--hi:#0f8a4f;--warn:#b23b3b;--warn-bg:#fbebeb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1319;--fg:#e8ebf0;--muted:#9aa4b2;
--line:#232a35;--card:#171c24;--accent:#8b85f5;--accent-soft:#1e2130;--hi:#4ade80;
--warn:#f87171;--warn-bg:#2a1414}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 80px}
a{color:var(--accent)}
.back{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;font-weight:600;
text-decoration:none;margin-bottom:16px}
.back:hover{text-decoration:underline}
h1{font-size:1.4rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px;font-size:.92rem}
.plan-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
flex-wrap:wrap;margin-bottom:12px}
.plan-head .ready{font-weight:700;font-size:1.05rem;color:var(--hi)}
.plan-actions{display:flex;gap:8px;flex-wrap:wrap}
button.dl{padding:10px 15px;border:1px solid var(--accent);border-radius:9px;
background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:.9rem;cursor:pointer}
button.dl.ghost{background:var(--bg);color:var(--accent)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.plan-frame{width:100%;height:78vh;min-height:460px;border:1px solid var(--line);
border-radius:12px;background:var(--bg);display:block}
.state{border:1px solid var(--line);border-radius:14px;padding:28px 22px;background:var(--card);
text-align:center;color:var(--muted)}
.state h2{margin:0 0 8px;font-size:1.15rem;color:var(--fg)}
.state.err{border-color:var(--warn);background:var(--warn-bg)}
.state.err h2{color:var(--warn)}
.state p{margin:0 0 14px}
.state a.cta{display:inline-block;padding:10px 16px;border:1px solid var(--accent);
border-radius:9px;text-decoration:none;font-weight:700;font-size:.9rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class=wrap>
  <a class=back href="/plan/">&larr; Back to the gallery</a>
  <div id=view></div>
  <p id=live aria-live=polite class=sr></p>
</div>

<script type=module>
/* Ticket #9 — the saved-run viewer. A run persisted by the write path (#8) is re-opened here
   by its permalink /plan/:id (a vercel.json rewrite serves this static file for that URL).
   Viewing NEVER re-runs the paid pipeline: the page fetches the stored record from
   GET /api/plan/:id and shows the VERBATIM stored plan_html in the SAME maximally-restrictive
   sandboxed <iframe srcdoc> the live path (index.html) uses — set via the .srcdoc property,
   never injected into the parent DOM.

   Absolute module/asset/API paths (/js/..., /api/...) are used deliberately: this page is
   served under /plan/<id>, so relative ./js/... would resolve against /plan/ and 404. The
   CSP (script-src 'self', connect-src 'self') allows same-origin absolute paths. */
import { runIdFromPath, planViewState } from '/js/plan-view.js';
import { downloadName } from '/js/plan-download.js';

const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; };
const $ = (id) => document.getElementById(id);

/* Save `text` to disk as a self-contained file via a one-shot Blob URL (same technique as
   index.html): the object URL is created on click and revoked right after, so nothing leaks. */
function download(filename, text, mime) {
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = el('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 0);
}

/* Render the stored plan. `plan_html` is shown VERBATIM in a sandboxed <iframe srcdoc> — the
   sandbox attribute is empty, i.e. maximally restrictive (no scripts, no same-origin, no
   forms): the plan is static self-contained HTML that needs none of those, and the empty
   sandbox keeps its inline CSS from colliding with the site and stops it touching this page.
   We set the srcdoc PROPERTY, never inject into the parent DOM. Download buttons save the same
   HTML and the plan_json (reusing downloadName from the live path). */
function renderFound(record) {
  const box = $('view');
  box.innerHTML = '';
  const city = record.inputs && typeof record.inputs === 'object' ? record.inputs.city : '';

  box.appendChild(el('h1', null, 'Your hackathon plan'));
  const sub = el('p', 'sub');
  const bits = [];
  if (city) bits.push(String(city));
  if (record.created_at) {
    const d = new Date(record.created_at);
    if (!isNaN(d)) bits.push('Generated ' + d.toLocaleDateString(undefined,
      { year: 'numeric', month: 'long', day: 'numeric' }));
  }
  sub.textContent = bits.length ? bits.join(' · ') : 'A saved, sourced plan.';
  box.appendChild(sub);

  const head = el('div', 'plan-head');
  head.appendChild(el('div', 'ready', 'This plan is saved.'));
  const actions = el('div', 'plan-actions');

  const dlHtml = el('button', 'dl', 'Download plan (HTML)');
  dlHtml.type = 'button';
  dlHtml.onclick = () => download(downloadName(city, 'html'), record.plan_html, 'text/html');
  actions.appendChild(dlHtml);

  if (record.plan_json != null) {
    const dlJson = el('button', 'dl ghost', 'Download data (JSON)');
    dlJson.type = 'button';
    dlJson.onclick = () => download(
      downloadName(city, 'json'),
      JSON.stringify(record.plan_json, null, 2),
      'application/json',
    );
    actions.appendChild(dlJson);
  }
  head.appendChild(actions);
  box.appendChild(head);

  const frame = document.createElement('iframe');
  frame.className = 'plan-frame';
  frame.title = 'Saved hackathon plan';
  // Empty value = every sandbox restriction on. Do NOT grant allow-scripts/allow-same-origin.
  frame.setAttribute('sandbox', '');
  frame.setAttribute('referrerpolicy', 'no-referrer');
  frame.srcdoc = record.plan_html;
  box.appendChild(frame);

  $('live').textContent = 'The saved plan is ready.';
}

/* Clean not-found state — a bogus, stale, or unknown id fails softly, never a crash or an
   error spew, with a way back to the gallery. */
function renderNotFound() {
  const box = $('view');
  box.innerHTML = '';
  const s = el('div', 'state err');
  s.appendChild(el('h2', null, 'Plan not found'));
  s.appendChild(el('p', null,
    'This plan link is not valid, or the plan is no longer available.'));
  const cta = el('a', 'cta', 'Browse the gallery');
  cta.href = '/plan/';
  s.appendChild(cta);
  box.appendChild(s);
  $('live').textContent = 'Plan not found.';
}

async function load() {
  const box = $('view');
  box.innerHTML = '';
  box.appendChild(el('div', 'state', 'Loading the plan…'));

  const id = runIdFromPath(location.pathname);
  if (!id) { renderNotFound(); return; }

  let status = 0;
  let record = null;
  try {
    const res = await fetch('/api/plan/' + encodeURIComponent(id), {
      headers: { Accept: 'application/json' },
    });
    status = res.status;
    if (status === 200) {
      try { record = await res.json(); } catch (_) { record = null; }
    }
  } catch (_) {
    // Network failure — fall through to the not-found state rather than hanging.
    status = 0;
  }

  if (planViewState(status, record) === 'found') renderFound(record);
  else renderNotFound();
}

load();
</script>
</body>
</html>
